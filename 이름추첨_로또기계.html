<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>이름 추첨 로또기계</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Orbitron:wght@700;900&display=swap">
<style>
:root{
  --gold:#ffd45a; --text:#eef1ff; --muted:#9aa5d1; --line:rgba(255,255,255,.12);
  --font:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:var(--font); color:var(--text); min-height:100vh; overflow-x:hidden;
  background:radial-gradient(1100px 650px at 50% -10%,#2b3684 0%,transparent 62%),linear-gradient(180deg,#141a44,#080b1e);
  background-color:#080b1e; -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;touch-action:manipulation;cursor:pointer}
#app{max-width:600px;margin:0 auto;padding:16px 16px 40px}
.hidden{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* 화면 전환 */
.screen{display:none}
.screen.active{display:block;animation:fadeIn .45s ease both}
.screen.leaving{animation:shrinkOut .38s ease both}
@keyframes fadeIn{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
@keyframes shrinkOut{to{opacity:0;transform:scale(.88)}}

/* 버튼 */
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;font-size:15px;color:var(--text);background:rgba(255,255,255,.1);transition:transform .1s,filter .2s,opacity .2s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.small{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.ghost{background:rgba(255,255,255,.07);border:1px solid var(--line)}
.btn.primary{background:linear-gradient(180deg,#ffe07a,#f5b400);color:#2a1c00;box-shadow:0 6px 18px rgba(245,180,0,.28)}
.btn.blue{background:linear-gradient(180deg,#5aa2ff,#2a6ee6);color:#fff;box-shadow:0 6px 18px rgba(42,110,230,.3)}
.btn.big{width:100%;padding:16px;font-size:17px;border-radius:14px}

/* 화면 1 */
.card{background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));border:1px solid var(--line);border-radius:22px;padding:22px 18px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.s1-head{text-align:center;margin-bottom:20px}
.minis{display:flex;justify-content:center;gap:6px;margin-bottom:12px}
.minis i{width:22px;height:22px;border-radius:50%;box-shadow:inset -3px -4px 6px rgba(0,0,0,.3),0 3px 6px rgba(0,0,0,.3);animation:hop 1.6s ease-in-out infinite}
.minis i::after{content:'';display:block;width:7px;height:5px;margin:4px 0 0 5px;border-radius:50%;background:rgba(255,255,255,.75)}
.minis i:nth-child(2){animation-delay:.15s}.minis i:nth-child(3){animation-delay:.3s}.minis i:nth-child(4){animation-delay:.45s}.minis i:nth-child(5){animation-delay:.6s}
@keyframes hop{0%,60%,100%{transform:none}30%{transform:translateY(-8px)}}
h1{font-size:clamp(23px,6.4vw,30px);margin:0 0 4px;font-weight:900;letter-spacing:-.5px}
.s1-head p{margin:0;color:var(--muted);font-size:14px}
.field{margin-bottom:18px}
.label{font-weight:700;font-size:14px;margin-bottom:8px;color:#cfd6f7;display:block}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:rgba(0,0,0,.25);padding:5px;border-radius:14px}
.seg button{border:0;border-radius:10px;padding:10px 4px;background:transparent;color:var(--muted);font-weight:700;font-size:13.5px;line-height:1.25;word-break:keep-all}
.seg button.on{background:linear-gradient(180deg,#ffe07a,#f5b400);color:#2a1c00;box-shadow:0 4px 12px rgba(245,180,0,.35)}
.text-in{width:100%;margin-top:8px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--text);font:600 16px var(--font);outline:none}
textarea{width:100%;min-height:150px;resize:vertical;padding:14px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--text);font:500 16px/1.6 var(--font);outline:none}
.text-in:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,212,90,.18)}
textarea::placeholder,.text-in::placeholder{color:#6a74a0}
.label-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.label-row .label{margin:0}
.count{font-weight:800;color:var(--gold);font-size:15px}
.count.over{color:#ff6b6b}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.warn{margin-top:10px;padding:10px 12px;border-radius:12px;background:rgba(255,107,107,.12);border:1px solid rgba(255,107,107,.35);color:#ffc9c9;font-size:13.5px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.warnbtn{background:#ff6b6b;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;max-height:230px;overflow:auto;padding:2px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 4px 4px 10px;border-radius:999px;background:rgba(255,255,255,.1);font-size:14px;font-weight:600;max-width:100%;animation:chipIn .2s ease}
@keyframes chipIn{from{transform:scale(.7);opacity:0}}
.chip i{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:inset -2px -2px 3px rgba(0,0,0,.3)}
.chip .cn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px}
.chip.dup{background:rgba(255,107,107,.25);outline:1px solid rgba(255,107,107,.6)}
.cx{width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.28);color:#fff;font-size:15px;line-height:1;display:grid;place-items:center;padding:0;flex:none}
.hint{text-align:center;color:var(--muted);font-size:13px;margin:10px 0 0}
.hint.ok{color:#8ce99a}

/* 화면 2 */
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.marquee{position:relative;height:46px;border-radius:10px;background:#140606;border:3px solid #2b2f3a;box-shadow:inset 0 0 12px #000,0 4px 14px rgba(0,0,0,.5);overflow:hidden;margin-bottom:6px}
.marquee-track{position:absolute;top:0;left:0;height:100%;display:flex;align-items:center;white-space:nowrap;animation:scrollx var(--dur,14s) linear infinite;will-change:transform}
.marquee-track span{font:800 26px/1 var(--font);color:#ffb627;text-shadow:0 0 6px #ff8a00,0 0 14px rgba(255,120,0,.7);letter-spacing:2px}
.marquee::after{content:'';position:absolute;inset:0;background:radial-gradient(circle,transparent 1.1px,rgba(12,0,0,.82) 1.7px) 0 0/4px 4px;pointer-events:none}
@keyframes scrollx{from{transform:translateX(0)}to{transform:translateX(-50%)}}

.stage{position:relative;display:flow-root;padding-bottom:16px}
#machine{position:absolute;left:0;top:0;pointer-events:none;z-index:2}
.mbody{position:relative;z-index:1;border-radius:20px;padding:18px 14px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,rgba(0,0,0,.04) 1px 3px),linear-gradient(180deg,#eef1f5 0%,#bfc6cf 14%,#8f98a4 52%,#c5cbd3 86%,#717985 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.8),inset 0 -3px 0 rgba(0,0,0,.25),0 14px 30px rgba(0,0,0,.45)}
.mbody::before{content:'';position:absolute;inset:8px;pointer-events:none;
  background:radial-gradient(circle,#fafcff 0 1px,#7a828e 2.5px,transparent 3.2px) left top/8px 8px no-repeat,
  radial-gradient(circle,#fafcff 0 1px,#7a828e 2.5px,transparent 3.2px) right top/8px 8px no-repeat,
  radial-gradient(circle,#fafcff 0 1px,#7a828e 2.5px,transparent 3.2px) left bottom/8px 8px no-repeat,
  radial-gradient(circle,#fafcff 0 1px,#7a828e 2.5px,transparent 3.2px) right bottom/8px 8px no-repeat}
.panel{width:100%;max-width:320px;background:linear-gradient(180deg,#1b1f27,#2c323d);border-radius:14px;padding:10px 12px 8px;box-shadow:inset 0 3px 8px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.6);text-align:center}
.dlabel{font-size:12px;letter-spacing:3px;color:#8fa0b8;font-weight:800}
.drow{display:flex;align-items:center;justify-content:center;gap:12px;margin:7px 0}
.step{width:42px;height:42px;border-radius:50%;border:0;font-size:24px;font-weight:900;color:#2b2f36;line-height:1;padding:0;background:radial-gradient(circle at 40% 30%,#fff,#c9cfd7 60%,#8b939e);box-shadow:0 3px 0 #555c66,0 5px 10px rgba(0,0,0,.4)}
.step:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #555c66}
.step:disabled{opacity:.45;cursor:not-allowed}
.display{position:relative;width:118px;height:62px;border-radius:10px;background:#050d07;border:2px solid #000;box-shadow:inset 0 0 14px rgba(0,0,0,.9),0 0 0 3px #3a414c;transition:box-shadow .2s}
.display::before{content:'888';position:absolute;inset:0;display:grid;place-items:center;font:900 36px 'Orbitron',monospace;color:rgba(72,255,122,.07);letter-spacing:2px;pointer-events:none}
.display input{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;text-align:center;font:900 36px 'Orbitron',monospace;color:#4dff7c;text-shadow:0 0 8px rgba(77,255,124,.8),0 0 18px rgba(77,255,124,.4);outline:none;letter-spacing:2px;caret-color:#4dff7c;padding:0}
.display input:disabled{opacity:.55}
.display.err{box-shadow:inset 0 0 14px rgba(0,0,0,.9),0 0 0 3px #ff4d4d}
.display.shake{animation:shake .45s}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.remain{font-size:13px;color:#cbd5e1;font-weight:700}
.msg{min-height:20px;font-size:13px;font-weight:700;color:var(--gold);margin-top:3px;line-height:1.4}
.msg.err{color:#ff8a8a}
.start-btn{width:min(100%,260px);border:0;border-radius:999px;padding:16px 20px;font-size:20px;font-weight:900;letter-spacing:2px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3);
  background:radial-gradient(circle at 50% 25%,#ff7b7b,#e0102f 58%,#93001a);box-shadow:0 6px 0 #6b0010,0 12px 22px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.35);transition:transform .08s,box-shadow .08s,filter .2s}
.start-btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 #6b0010,0 6px 12px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.35)}
.start-btn:disabled{filter:grayscale(.85) brightness(.85);cursor:not-allowed}

.tray-wrap{position:relative;background:linear-gradient(180deg,#0e1430,#141b3d);border-radius:18px;padding:14px 12px 16px;border:1px solid var(--line);box-shadow:inset 0 6px 16px rgba(0,0,0,.5)}
.tray-wrap::before{content:'';position:absolute;top:-6px;right:calc(var(--chute,30px) - 24px);width:48px;height:12px;border-radius:0 0 12px 12px;background:linear-gradient(90deg,#666e79,#e6eaee,#7a828e)}
.tray-head{display:flex;justify-content:space-between;font-size:13px;font-weight:800;color:var(--muted);margin-bottom:10px;letter-spacing:1px}
.tray{display:flex;flex-wrap:wrap;gap:12px 8px;min-height:92px;align-content:flex-start}
.tray-empty{width:100%;text-align:center;color:#5d6894;font-size:14px;padding:28px 0}
.tb{display:flex;flex-direction:column;align-items:center;gap:5px;width:66px}
.badge{font-size:11.5px;font-weight:900;color:#2a1c00;background:var(--gold);padding:2px 8px;border-radius:999px;white-space:nowrap}
.tball{position:relative;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 50%,var(--c) 55%,var(--d) 100%);box-shadow:0 6px 10px rgba(0,0,0,.45)}
.tball::after,.wball::after{content:'';position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:radial-gradient(ellipse 22% 15% at 31% 24%,rgba(255,255,255,.85),rgba(255,255,255,0)),radial-gradient(circle at 36% 30%,rgba(255,255,255,.25),rgba(255,255,255,0) 45%),radial-gradient(circle at 50% 50%,transparent 62%,rgba(0,0,0,.3) 100%)}
.tball span{width:68%;height:68%;border-radius:50%;background:rgba(255,255,255,.94);display:flex;align-items:center;justify-content:center;color:#1d1d1f;font-weight:900;overflow:hidden;white-space:nowrap;line-height:1}
.tb.arrive .tball{animation:pop .75s cubic-bezier(.3,1.4,.5,1) both}
.tb.arrive .badge{animation:fadeIn .4s .2s both}
.tb.glow .tball{box-shadow:0 0 0 3px rgba(255,212,90,.9),0 0 22px rgba(255,212,90,.8)}
@keyframes pop{0%{transform:translateY(-26px) scale(.3);opacity:0}40%{transform:scale(1.5);opacity:1}62%{transform:scale(.88)}80%{transform:scale(1.08)}100%{transform:scale(1)}}

.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
.actions .wide{grid-column:1/-1}

/* 당첨 오버레이 */
.winner{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(4,6,18,.8);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);padding:20px;animation:fadeIn .3s}
.wcard{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;max-width:100%}
.wtitle{color:var(--muted);font-weight:800;font-size:15px}
.wlabel{font-size:clamp(30px,9vw,46px);font-weight:900;color:var(--gold);text-shadow:0 0 18px rgba(255,212,90,.6)}
.wball{position:relative;width:min(64vw,300px);height:min(64vw,300px);border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 50%,var(--c) 55%,var(--d) 100%);box-shadow:0 0 60px rgba(255,212,90,.45),0 20px 40px rgba(0,0,0,.5);animation:bigPop .9s cubic-bezier(.2,1.5,.4,1) both}
.wball span{width:66%;height:66%;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;color:#151515;overflow:hidden;padding:0 6%;word-break:keep-all;text-align:center;line-height:1.1}
@keyframes bigPop{0%{transform:scale(.1) rotate(-90deg);opacity:0}60%{transform:scale(1.1) rotate(8deg);opacity:1}100%{transform:none}}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:60;display:none}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:rgba(20,24,48,.95);border:1px solid var(--line);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:70;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:640px){ #app{padding-top:28px} .tb{width:72px} .tball{width:64px;height:64px} }
</style>
</head>
<body>
<div id="app">

  <!-- 화면 1: 이름 입력 -->
  <section id="screen1" class="screen active" aria-labelledby="h1">
    <div class="card">
      <header class="s1-head">
        <div class="minis" aria-hidden="true"><i style="background:#f6c000"></i><i style="background:#1f6fe5"></i><i style="background:#e53935"></i><i style="background:#8d939c"></i><i style="background:#25a748"></i></div>
        <h1 id="h1">이름 추첨 로또기계</h1>
        <p>이름을 넣고, 공을 섞고, 공정하게 뽑아요</p>
      </header>

      <div class="field">
        <span class="label" id="titleLabel">추첨 제목</span>
        <div class="seg" role="radiogroup" aria-labelledby="titleLabel" id="titleSeg">
          <button type="button" role="radio" data-mode="duty">당직 근무자 추첨</button>
          <button type="button" role="radio" data-mode="gift">상품권 당첨자 추첨</button>
          <button type="button" role="radio" data-mode="custom">직접 입력</button>
        </div>
        <input id="customTitle" class="text-in hidden" maxlength="30" placeholder="예: 10월 2주차 당직" aria-label="추첨 제목 직접 입력">
      </div>

      <div class="field">
        <div class="label-row"><label class="label" for="names">참여자 이름</label><span id="count" class="count" aria-live="polite">총 0명</span></div>
        <textarea id="names" placeholder="이름을 줄바꿈 또는 쉼표(,)로 구분해 입력하세요&#10;예) 홍길동, 김철수, 이영희"></textarea>
        <div class="tools">
          <button type="button" id="loadLast" class="btn ghost small hidden">지난 명단 불러오기</button>
          <button type="button" id="clearAll" class="btn ghost small">모두 지우기</button>
        </div>
        <div id="dupWarn" class="warn hidden" role="alert"><span id="dupText"></span><button type="button" id="dedupe" class="btn small warnbtn">중복 제거</button></div>
        <div id="limitWarn" class="warn hidden" role="alert"></div>
        <div id="chips" class="chips" aria-label="입력된 이름 목록"></div>
      </div>

      <button type="button" id="submitBtn" class="btn primary big" disabled>입력 완료</button>
      <p id="submitHint" class="hint">최소 2명 이상 입력해 주세요</p>
    </div>
  </section>

  <!-- 화면 2: 로또기계 -->
  <section id="screen2" class="screen" aria-labelledby="srTitle">
    <div class="topbar">
      <button type="button" id="backTop" class="btn ghost small">← 명단 수정</button>
      <button type="button" id="muteBtn" class="btn ghost small" aria-pressed="false">🔊 소리 켜짐</button>
    </div>
    <h2 id="srTitle" class="sr-only"></h2>
    <div class="marquee" aria-hidden="true"><div class="marquee-track" id="marqueeTrack"></div></div>

    <div id="stage" class="stage">
      <canvas id="machine" aria-hidden="true"></canvas>
      <div id="mbody" class="mbody">
        <div class="panel">
          <div class="dlabel">뽑을 인원</div>
          <div class="drow">
            <button type="button" class="step" id="minusBtn" aria-label="1명 줄이기">−</button>
            <div class="display" id="displayWrap">
              <input id="countIn" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" value="1" autocomplete="off" aria-label="뽑을 인원 수" aria-describedby="remainText msg">
            </div>
            <button type="button" class="step" id="plusBtn" aria-label="1명 늘리기">+</button>
          </div>
          <div class="remain" id="remainText">남은 공 0개</div>
          <div class="msg" id="msg"></div>
        </div>
        <button type="button" id="startBtn" class="start-btn">추첨 시작</button>
      </div>
    </div>

    <div class="tray-wrap" id="trayWrap">
      <div class="tray-head"><span>결과 트레이</span><span id="trayCount"></span></div>
      <div id="tray" class="tray"></div>
    </div>

    <div class="actions" id="actions">
      <button type="button" id="saveBtn" class="btn primary">이미지 저장</button>
      <button type="button" id="shareBtn" class="btn primary hidden">공유</button>
      <button type="button" id="copyBtn" class="btn ghost">결과 복사</button>
      <button type="button" id="contBtn" class="btn blue wide">이어서 추첨</button>
      <button type="button" id="resetBtn" class="btn ghost">다시 추첨</button>
      <button type="button" id="editBtn" class="btn ghost">이름 다시 입력</button>
    </div>
  </section>
</div>

<div id="live" class="sr-only" aria-live="polite"></div>

<div id="winner" class="winner hidden" role="dialog" aria-modal="true" aria-labelledby="wLabel">
  <div class="wcard">
    <div class="wtitle" id="wTitle"></div>
    <div class="wlabel" id="wLabel">★ 당첨 ★</div>
    <div class="wball" id="wBall"><span id="wName"></span></div>
    <button type="button" class="btn primary" id="wClose" style="min-width:140px">확인</button>
  </div>
</div>
<canvas id="confetti" aria-hidden="true"></canvas>
<div id="toast" class="toast" role="status"></div>

<script>
(() => {
'use strict';

/* ================= 공통 ================= */
const $ = s => document.querySelector(s);
const FONT = '"Pretendard Variable", Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
const COLORS = [
  { base:'#f6c000', light:'#ffe680', dark:'#a87a00' }, // 노랑

/* 암호학적 난수 + Fisher–Yates */
function randInt(n){
  const buf = new Uint32Array(1);
  const limit = Math.floor(0x100000000 / n) * n; // 모듈로 편향 제거
  let x;
  do { crypto.getRandomValues(buf); x = buf[0]; } while (x >= limit);
  return x % n;
}
function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){ const j = randInt(i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

/* 폰트 로딩 대기 (한글 서브셋까지) */
async function ensureFonts(text){
  if (!document.fonts) return;
  const t = text || '가';
  const loads = [400, 500, 700, 800, 900].map(w => document.fonts.load(`${w} 40px "Pretendard Variable"`, t).catch(() => {}));
  loads.push(document.fonts.load(`700 40px "Noto Sans KR"`, t).catch(() => {}));
  await Promise.race([Promise.all(loads), sleep(2500)]);
  await Promise.race([document.fonts.ready, sleep(2500)]);
}

let toastTimer;
function toast(t){
  const el = $('#toast'); el.textContent = t; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}
function announce(t){ const el = $('#live'); el.textContent = ''; setTimeout(() => { el.textContent = t; }, 30); }

function switchScreen(from, to, after){
  from.classList.add('leaving');
  setTimeout(() => {
    from.classList.remove('active', 'leaving');
    to.classList.add('active');
    window.scrollTo(0, 0);
    if (after) after();
  }, 380);
}

/* ================= 효과음 (Web Audio) ================= */
const Sound = {
  ctx:null, master:null, muted:false, mix:null, lastTick:0, noiseBuf:null,
  ensure(){
    if (!this.ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { this.ctx = new AC(); } catch(e){ return null; }
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.9;
      this.master.connect(this.ctx.destination);
      const len = this.ctx.sampleRate * 2;
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
    return this.ctx;
  },
  setMuted(m){
    this.muted = m;
    if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.9, this.ctx.currentTime, 0.02);
  },
  noise(){ const s = this.ctx.createBufferSource(); s.buffer = this.noiseBuf; s.loop = true; return s; },
  tone(freq, t, dur, type = 'sine', vol = 0.2, freqEnd){
    const c = this.ctx; if (!c) return;
    const o = c.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.master);
    o.start(t); o.stop(t + dur + 0.05);
  },
  mixStart(){
    const c = this.ensure(); if (!c) return;
    this.mixStop();
    const src = this.noise();
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 650; bp.Q.value = 0.6;
    const g = c.createGain(); g.gain.value = 0; g.gain.setTargetAtTime(0.22, c.currentTime, 0.15);
    const lfo = c.createOscillator(); lfo.frequency.value = 5.5;
    const lg = c.createGain(); lg.gain.value = 0.07;
    lfo.connect(lg).connect(g.gain);
    src.connect(bp).connect(g).connect(this.master);
    src.start(); lfo.start();
    this.mix = { src, lfo, g };
  },
  mixLevel(v){ if (this.mix) this.mix.g.gain.setTargetAtTime(0.22 * v, this.ctx.currentTime, 0.2); },
  mixStop(){
    if (!this.mix) return;
    const { src, lfo, g } = this.mix, t = this.ctx.currentTime;
    g.gain.cancelScheduledValues(t); g.gain.setTargetAtTime(0, t, 0.12);
    src.stop(t + 0.7); lfo.stop(t + 0.7);
    this.mix = null;
  },
  tick(){
    if (!this.ctx || !this.mix) return;
    const now = performance.now(); if (now - this.lastTick < 45) return;
    this.lastTick = now;
    this.tone(1400 + Math.random() * 1600, this.ctx.currentTime, 0.03, 'triangle', 0.035);
  },
  suck(){ const c = this.ensure(); if (!c) return; this.tone(240, c.currentTime, 0.45, 'sine', 0.08, 1100); },
  drop(){
    const c = this.ensure(); if (!c) return;
    const t = c.currentTime;
    [0, 0.13, 0.22, 0.28].forEach((d, i) => this.tone(640 - i * 40, t + d, 0.09, 'sine', 0.28 * Math.pow(0.55, i), 300));
    this.tone(1900, t, 0.04, 'square', 0.03);
  },
  roll(dur){
    const c = this.ensure(); if (!c) return;
    const t = c.currentTime;
    const src = this.noise();
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 0.7;
    const amp = c.createGain(); amp.gain.value = 0.5;
    const lfo = c.createOscillator(); lfo.type = 'square'; lfo.frequency.value = 17;
    const lg = c.createGain(); lg.gain.value = 0.5;
    lfo.connect(lg).connect(amp.gain);
    const out = c.createGain();
    out.gain.setValueAtTime(0.03, t); out.gain.linearRampToValueAtTime(0.3, t + dur); out.gain.linearRampToValueAtTime(0, t + dur + 0.05);
    src.connect(bp).connect(amp).connect(out).connect(this.master);
    src.start(t); lfo.start(t); src.stop(t + dur + 0.1); lfo.stop(t + dur + 0.1);
  },
  fanfare(){
    const c = this.ensure(); if (!c) return;
    const t = c.currentTime + 0.02;
    [[523.25, 0, .14], [659.25, .14, .14], [783.99, .28, .14], [1046.5, .42, .9]].forEach(([f, d, l]) => {
      this.tone(f, t + d, l + 0.1, 'square', 0.08);
      this.tone(f * 2, t + d, l, 'triangle', 0.04);
    });
    [523.25, 659.25, 783.99].forEach(f => this.tone(f, t + 0.42, 1.2, 'sawtooth', 0.03));
  }
};

const screen1 = $('#screen1'), screen2 = $('#screen2');

const dupWarn = $('#dupWarn'), dupText = $('#dupText'), limitWarn = $('#limitWarn'), customTitle = $('#customTitle'), loadLastBtn = $('#loadLast');
let titleMode = 'duty';
let currentList = [];

function parseNames(text){
  return text.split(/[\n,，、;]+/).map(s => s.replace(/\s+/g, ' ').trim()).filter(Boolean);
}
function getTitle(){
  if (titleMode === 'custom') return customTitle.value.trim() || '이름 추첨';
  return TITLES[titleMode];
}
function setTitleMode(mode, focus){
  titleMode = mode;
  document.querySelectorAll('#titleSeg button').forEach(b => {
    const on = b.dataset.mode === mode;
    b.setAttribute('aria-checked', String(on));
    b.classList.toggle('on', on);
  });
  customTitle.classList.toggle('hidden', mode !== 'custom');
  if (mode === 'custom' && focus) customTitle.focus();
}

function renderPreview(){
  const list = parseNames(namesEl.value);
  currentList = list;
  const cnt = new Map();
  list.forEach(n => cnt.set(n, (cnt.get(n) || 0) + 1));
  const dups = [...cnt].filter(([, c]) => c > 1);

  countEl.textContent = `총 ${list.length}명`;
  countEl.classList.toggle('over', list.length > MAX_NAMES);

  chipsEl.innerHTML = '';
  const frag = document.createDocumentFragment();
  list.forEach((n, i) => {
    const chip = document.createElement('span');
    chip.className = 'chip' + (cnt.get(n) > 1 ? ' dup' : '');
    const dot = document.createElement('i'); dot.style.background = COLORS[i % 5].base;
    const t = document.createElement('span'); t.className = 'cn'; t.textContent = n; t.title = n;
    const x = document.createElement('button'); x.type = 'button'; x.className = 'cx'; x.dataset.i = i;
    x.setAttribute('aria-label', `${n} 삭제`); x.textContent = '×';
    chip.append(dot, t, x); frag.appendChild(chip);
  });
  chipsEl.appendChild(frag);

  if (dups.length){
    dupWarn.classList.remove('hidden');
    dupText.textContent = `중복된 이름이 있어요: ${dups.map(([n, c]) => `${n}(${c})`).join(', ')}`;
  } else dupWarn.classList.add('hidden');

  if (list.length > MAX_NAMES){
    limitWarn.classList.remove('hidden');
    limitWarn.textContent = `최대 ${MAX_NAMES}명까지 가능해요. ${list.length - MAX_NAMES}명을 줄여 주세요.`;
  } else limitWarn.classList.add('hidden');

  let ok = true, hint;
  if (list.length < 2){ ok = false; hint = '최소 2명 이상 입력해 주세요'; }
  else if (list.length > MAX_NAMES){ ok = false; hint = `최대 ${MAX_NAMES}명까지 입력할 수 있어요`; }
  else if (dups.length){ ok = false; hint = '중복된 이름을 정리하면 진행할 수 있어요'; }
  else hint = `${list.length}명으로 추첨을 준비합니다`;
  submitBtn.disabled = !ok;
  hintEl.textContent = hint;
  hintEl.classList.toggle('ok', ok);
}

/* ---- 공 그리기 ---- */
function fitText(g, text, maxW, start, min, weight = 700){
  let size = start;
  const setF = s => { g.font = `${weight} ${s}px ${FONT}`; };
  setF(size);
  let w = g.measureText(text).width;
  if (w > maxW){ size = Math.max(min, size * maxW / w); setF(size); w = g.measureText(text).width; }
  let t = text;
  if (w > maxW){
    let chars = Array.from(text);
    while (chars.length > 1 && g.measureText(chars.join('') + '…').width > maxW) chars.pop();
    t = chars.join('') + '…';
  }
  return { size, text:t, font:g.font };
}
function drawBallBase(g, x, y, r, ci, label){
  const C = COLORS[ci];
  const grd = g.createRadialGradient(x, y, r * 0.1, x, y, r);
  grd.addColorStop(0, C.light); grd.addColorStop(0.55, C.base); grd.addColorStop(1, C.dark);
  g.fillStyle = grd;
  g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  if (!label) return;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  if (r >= 15){
    g.fillStyle = 'rgba(255,255,255,0.95)';
    g.beginPath(); g.arc(x, y, r * 0.62, 0, Math.PI * 2); g.fill();
    g.strokeStyle = 'rgba(0,0,0,0.12)'; g.lineWidth = Math.max(1, r * 0.03); g.stroke();
    const f = fitText(g, label, r * 1.12, r * 0.46, Math.max(5, r * 0.22), 800);
    g.font = f.font; g.fillStyle = '#1d1d1f';
    g.fillText(f.text, x, y + r * 0.03);
  } else {
    const f = fitText(g, label, r * 1.75, r * 0.62, 4, 800);
    g.font = f.font;
    g.lineJoin = 'round'; g.lineWidth = Math.max(1.5, f.size * 0.22); g.strokeStyle = 'rgba(0,0,0,0.6)';
    g.strokeText(f.text, x, y + r * 0.03);
    g.fillStyle = '#fff'; g.fillText(f.text, x, y + r * 0.03);
  }
}
function drawBallGloss(g, x, y, r){
  let grd = g.createRadialGradient(x - r * 0.3, y - r * 0.35, r * 0.05, x, y, r);
  grd.addColorStop(0, 'rgba(255,255,255,0.32)');
  grd.addColorStop(0.45, 'rgba(255,255,255,0)');
  grd.addColorStop(0.82, 'rgba(0,0,0,0.10)');
  grd.addColorStop(1, 'rgba(0,0,0,0.38)');
  g.fillStyle = grd; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  g.save();
  g.translate(x - r * 0.4, y - r * 0.46); g.rotate(-0.6); g.scale(1, 0.6);
  const s = g.createRadialGradient(0, 0, 0, 0, 0, r * 0.34);
  s.addColorStop(0, 'rgba(255,255,255,0.92)'); s.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = s; g.beginPath(); g.arc(0, 0, r * 0.34, 0, Math.PI * 2); g.fill();
  g.restore();
  g.strokeStyle = 'rgba(255,255,255,0.2)'; g.lineWidth = Math.max(1, r * 0.05); g.lineCap = 'round';
  g.beginPath(); g.arc(x, y, r * 0.86, Math.PI * 0.12, Math.PI * 0.55); g.stroke();
}
function makeGloss(){
  const G = M.geo, size = Math.ceil((G.spriteR * 2 + 4) * G.dpr);
  const c = document.createElement('canvas'); c.width = c.height = size;
  const x = c.getContext('2d'); x.scale(G.dpr, G.dpr);
  const h = size / G.dpr / 2; G.spriteHalf = h;
  drawBallGloss(x, h, h, G.spriteR);
  return c;
}
function makeSprite(b){
  const G = M.geo, size = Math.ceil((G.spriteR * 2 + 4) * G.dpr);
  const c = document.createElement('canvas'); c.width = c.height = size;
  const x = c.getContext('2d'); x.scale(G.dpr, G.dpr);
  const h = size / G.dpr / 2;
  drawBallBase(x, h, h, G.spriteR, b.ci, b.name);
  b.sprite = c;
}
function rebuildSprites(){ if (!M.geo) return; M.gloss = makeGloss(); M.balls.forEach(makeSprite); }
function drawBallAt(b, x, y, r, ang){
  const G = M.geo, half = G.spriteHalf * (r / G.spriteR);
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  ctx.drawImage(b.sprite, -half, -half, half * 2, half * 2);
  ctx.restore();
  ctx.drawImage(M.gloss, x - half, y - half, half * 2, half * 2);
}

/* ---- 레이아웃 ---- */
function ballRadius(n, R){ return clamp(R * Math.sqrt(0.40 / Math.max(n, 1)), 7, R * 0.2); }

function buildPath(G){
  const pts = [], step = 2;
  const addLine = (x0, y0, x1, y1) => {
    const L = Math.hypot(x1 - x0, y1 - y0), n = Math.max(1, Math.ceil(L / step));
    for (let i = pts.length ? 1 : 0; i <= n; i++) pts.push({ x:x0 + (x1 - x0) * i / n, y:y0 + (y1 - y0) * i / n });
  };
  const addArc = (ax, ay, r, a0, a1) => {
    const n = Math.max(2, Math.ceil(Math.abs(a1 - a0) * r / step));
    for (let i = 1; i <= n; i++){ const t = a0 + (a1 - a0) * i / n; pts.push({ x:ax + Math.cos(t) * r, y:ay + Math.sin(t) * r }); }
  };
  const { cx, cy, R, tubeR, topY, a, tubeX, H } = G;
  const endY = H - tubeR - 2;
  addLine(cx, cy - R + tubeR + 4, cx, topY);
  addArc(cx + a, topY, a, Math.PI, Math.PI * 1.5);
  addLine(cx + a, topY - a, tubeX - a, topY - a);
  addArc(tubeX - a, topY, a, Math.PI * 1.5, Math.PI * 2);
  addLine(tubeX, topY, tubeX, endY);
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y));
  const len = cum[cum.length - 1];
  const vertStart = len - (endY - topY);
  return { pts, cum, len, sPause: vertStart + (len - vertStart) * 0.42 };
}
function pointAt(s){
  const { pts, cum, len } = M.geo.path;
  s = clamp(s, 0, len);
  let lo = 0, hi = cum.length - 1;
  while (hi - lo > 1){ const mid = (lo + hi) >> 1; if (cum[mid] < s) lo = mid; else hi = mid; }
  const seg = cum[hi] - cum[lo] || 1, t = (s - cum[lo]) / seg;
  return { x:lerp(pts[lo].x, pts[hi].x, t), y:lerp(pts[lo].y, pts[hi].y, t) };
}

function roundRectPath(g, x, y, w, h, r){
  r = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function metalGrad(g, x0, x1){
  const m = g.createLinearGradient(x0, 0, x1, 0);
  m.addColorStop(0, '#5d6570'); m.addColorStop(0.2, '#d9dee4'); m.addColorStop(0.45, '#9aa3ae');
  m.addColorStop(0.7, '#eef1f4'); m.addColorStop(1, '#666e79');
  return m;
}

function buildLayers(){
  const G = M.geo;
  const mk = () => { const c = document.createElement('canvas'); c.width = canvas.width; c.height = canvas.height; const x = c.getContext('2d'); x.setTransform(G.dpr, 0, 0, G.dpr, 0, 0); return [c, x]; };
  const [bk, b] = mk(), [fr, f] = mk();
  const { cx, cy, R, a, topY, tubeX, H, tubeR } = G;
  const tw = tubeR * 2 + 4;

  const tube = new Path2D();
  tube.moveTo(cx, cy - R + 2); tube.lineTo(cx, topY);
  tube.arc(cx + a, topY, a, Math.PI, Math.PI * 1.5);
  tube.lineTo(tubeX - a, topY - a);
  tube.arc(tubeX - a, topY, a, Math.PI * 1.5, Math.PI * 2);
  tube.lineTo(tubeX, H - 2);

  const o = tw * 0.3, hl = new Path2D();
  hl.moveTo(cx - o, cy - R - 2); hl.lineTo(cx - o, topY);
  hl.arc(cx + a, topY, a + o, Math.PI, Math.PI * 1.5);
  hl.lineTo(tubeX - a, topY - a - o);
  hl.arc(tubeX - a, topY, a + o, Math.PI * 1.5, Math.PI * 2);
  hl.lineTo(tubeX + o, H - 12);

  // 뒤 레이어: 튜브 몸체
  b.lineJoin = 'round'; b.lineCap = 'butt';
  b.strokeStyle = 'rgba(200,230,255,0.55)'; b.lineWidth = tw + 4; b.stroke(tube);
  b.strokeStyle = '#0f1934'; b.lineWidth = tw; b.stroke(tube);
  b.strokeStyle = 'rgba(130,180,255,0.10)'; b.stroke(tube);

  // 뒤 레이어: 돔 유리 안쪽
  let gr = b.createRadialGradient(cx, cy - R * 0.2, R * 0.1, cx, cy, R);
  gr.addColorStop(0, 'rgba(150,190,255,0.05)'); gr.addColorStop(0.75, 'rgba(150,190,255,0.10)'); gr.addColorStop(1, 'rgba(190,220,255,0.24)');
  b.fillStyle = gr; b.beginPath(); b.arc(cx, cy, R, 0, Math.PI * 2); b.fill();
  b.save(); b.beginPath(); b.arc(cx, cy, R, 0, Math.PI * 2); b.clip();
  gr = b.createRadialGradient(cx, cy + R, 0, cx, cy + R, R * 0.75);
  gr.addColorStop(0, 'rgba(120,200,255,0.22)'); gr.addColorStop(1, 'rgba(120,200,255,0)');
  b.fillStyle = gr; b.fillRect(cx - R, cy, R * 2, R);
  b.restore();

  // 앞 레이어: 받침대
  const pw1 = R * 0.62, pw2 = R * 1.05, py1 = cy + R - 5, py2 = G.bodyTop + 2;
  f.beginPath(); f.moveTo(cx - pw1 / 2, py1); f.lineTo(cx + pw1 / 2, py1); f.lineTo(cx + pw2 / 2, py2); f.lineTo(cx - pw2 / 2, py2); f.closePath();
  f.fillStyle = metalGrad(f, cx - pw2 / 2, cx + pw2 / 2); f.fill();
  f.beginPath(); f.ellipse(cx, py1, pw1 / 2 + 8, 7, 0, 0, Math.PI * 2);
  f.fillStyle = metalGrad(f, cx - pw1 / 2 - 8, cx + pw1 / 2 + 8); f.fill();
  f.strokeStyle = 'rgba(0,0,0,0.3)'; f.lineWidth = 1; f.stroke();

  // 앞 레이어: 유리 굴절/반사
  gr = f.createRadialGradient(cx, cy, R * 0.78, cx, cy, R);
  gr.addColorStop(0, 'rgba(200,230,255,0)'); gr.addColorStop(0.8, 'rgba(200,230,255,0.16)'); gr.addColorStop(1, 'rgba(255,255,255,0.42)');
  f.fillStyle = gr; f.beginPath(); f.arc(cx, cy, R, 0, Math.PI * 2); f.fill();
  f.strokeStyle = 'rgba(255,255,255,0.55)'; f.lineWidth = 2; f.beginPath(); f.arc(cx, cy, R - 1, 0, Math.PI * 2); f.stroke();
  f.save(); f.translate(cx - R * 0.38, cy - R * 0.48); f.rotate(-0.7); f.scale(1, 0.45);
  gr = f.createRadialGradient(0, 0, 0, 0, 0, R * 0.45);
  gr.addColorStop(0, 'rgba(255,255,255,0.5)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  f.fillStyle = gr; f.beginPath(); f.arc(0, 0, R * 0.45, 0, Math.PI * 2); f.fill();
  f.restore();
  f.lineCap = 'round';
  f.strokeStyle = 'rgba(255,255,255,0.28)'; f.lineWidth = Math.max(3, R * 0.045);
  f.beginPath(); f.arc(cx, cy, R * 0.9, -Math.PI * 0.22, Math.PI * 0.18); f.stroke();
  f.strokeStyle = 'rgba(255,255,255,0.12)'; f.lineWidth = Math.max(2, R * 0.03);
  f.beginPath(); f.arc(cx, cy, R * 0.88, Math.PI * 0.62, Math.PI * 0.86); f.stroke();
  f.fillStyle = 'rgba(255,255,255,0.9)'; f.beginPath(); f.arc(cx - R * 0.56, cy - R * 0.52, Math.max(2, R * 0.03), 0, Math.PI * 2); f.fill();

  // 앞 레이어: 출구 칼라, 튜브 하이라이트, 튜브 끝
  roundRectPath(f, cx - tw / 2 - 6, cy - R - 12, tw + 12, 18, 5);
  f.fillStyle = metalGrad(f, cx - tw / 2 - 6, cx + tw / 2 + 6); f.fill();
  f.lineCap = 'round'; f.lineJoin = 'round';
  f.strokeStyle = 'rgba(255,255,255,0.32)'; f.lineWidth = 2; f.stroke(hl);
  roundRectPath(f, tubeX - tw / 2 - 5, H - 12, tw + 10, 12, 4);
  f.fillStyle = metalGrad(f, tubeX - tw / 2 - 5, tubeX + tw / 2 + 5); f.fill();

  M.layers = { bk, fr };
}

function layout(){
  const W = stage.clientWidth;
  if (!W) return;
  const tubeR = Math.round(clamp(W * 0.03, 11, 17));
  const tubeCol = Math.round(clamp(W * 0.15, 46, 78));
  const areaW = W - tubeCol;
  const R = Math.round(Math.min(areaW * 0.46, 240));
  const a = tubeR + 10, neck = 20;
  const topY = tubeR + 8 + a;
  const cx = Math.round(areaW / 2 + 6);
  const cy = topY + neck + R;
  const bodyTop = cy + R + 16;
  mbody.style.marginTop = bodyTop + 'px';
  mbody.style.marginRight = tubeCol + 'px';
  const H = stage.clientHeight;
  const old = M.geo;
  if (old && old.W === W && old.H === H) return;

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  const G = { W, H, dpr, tubeR, tubeCol, R, a, neck, topY, cx, cy, bodyTop, tubeX:W - tubeCol / 2 };
  G.path = buildPath(G);
  G.r = ballRadius(M.balls.length, R);
  G.spriteR = Math.max(G.r, tubeR);

  if (old){
    const k = R / old.R;
    M.balls.forEach(b => {
      if (b.inDome && !b.exit){ b.x = cx + (b.x - old.cx) * k; b.y = cy + (b.y - old.cy) * k; b.vx *= k; b.vy *= k; }
    });
  }
  M.balls.forEach(b => { b.r = G.r; });
  M.geo = G;
  buildLayers();
  if (!old || old.spriteR !== G.spriteR || old.dpr !== G.dpr || !M.gloss) rebuildSprites();
  else G.spriteHalf = old.spriteHalf;
  screen2.style.setProperty('--chute', (W - G.tubeX) + 'px');
}

if (window.ResizeObserver) new ResizeObserver(() => { if (screen2.classList.contains('active')) layout(); }).observe(stage);
else window.addEventListener('resize', () => { if (screen2.classList.contains('active')) layout(); });

/* ---- 물리 ---- */
function physics(act, h){
  const { cx, cy, R } = M.geo, G = 7.5 * R, w = M.wind, mixing = w > 0.05;
  const e = w > 0.3 ? 0.86 : 0.35;
  const damp = mixing ? 0.25 : 1.6;
  const vmax = R * 7;
  for (const b of act){
    let ax = 0, ay = G;
    if (mixing){
      const rel = (b.y - cy) / R; // -1(위) ~ 1(아래)
      ay -= G * (0.25 + 2.7 * Math.max(0, rel + 0.3)) * (0.4 + Math.random() * 1.2) * w; // 바닥에서 올라오는 바람
      ax += (Math.random() - 0.5) * G * 3 * w;
      if (Math.random() < 0.015 * w){ b.vy -= Math.random() * R * 3; b.vx += (Math.random() - 0.5) * R * 3; }
    }
    b.vx += ax * h; b.vy += ay * h;
    const f = 1 - damp * h; b.vx *= f; b.vy *= f;
    const sp = Math.hypot(b.vx, b.vy);
    if (sp > vmax){ b.vx *= vmax / sp; b.vy *= vmax / sp; }
    b.x += b.vx * h; b.y += b.vy * h;
  }
  const n = act.length;
  for (let i = 0; i < n; i++){
    const p = act[i];
    for (let j = i + 1; j < n; j++){
      const q = act[j];
      let dx = q.x - p.x, dy = q.y - p.y;
      const rs = p.r + q.r;
      let d2 = dx * dx + dy * dy;
      if (d2 >= rs * rs) continue;
      if (d2 < 1e-6){ dx = Math.random() - 0.5; dy = Math.random() - 0.5; d2 = dx * dx + dy * dy; }
      const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, ov = (rs - d) * 0.5;
      p.x -= nx * ov; p.y -= ny * ov; q.x += nx * ov; q.y += ny * ov;
      const rv = (q.vx - p.vx) * nx + (q.vy - p.vy) * ny;
      if (rv < 0){
        const jj = -(1 + e) * rv * 0.5;
        p.vx -= jj * nx; p.vy -= jj * ny; q.vx += jj * nx; q.vy += jj * ny;
        if (mixing && -rv > R * 2.2) Sound.tick();
      }
    }
  }
  for (const b of act){
    const dx = b.x - cx, dy = b.y - cy, lim = R - b.r - 3, d2 = dx * dx + dy * dy;
    if (d2 > lim * lim){
      const d = Math.sqrt(d2), nx = dx / d, ny = dy / d;
      b.x = cx + nx * lim; b.y = cy + ny * lim;
      const vn = b.vx * nx + b.vy * ny;
      if (vn > 0){ b.vx -= (1 + e) * vn * nx; b.vy -= (1 + e) * vn * ny; if (mixing && vn > R * 2.5) Sound.tick(); }
      b.vx *= 0.995; b.vy *= 0.995;
    }
  }
}

/* ---- 공 배출 ---- */
function exitBall(b, single){
  return new Promise(resolve => {
    b.exit = { phase:'suck', t0:performance.now(), fx:b.x, fy:b.y, r0:b.r, single, resolve, suckDur:450, tubeDur:900, rolled:false };
    b.drawR = b.r;
    M.exiting.push(b);
    Sound.suck();
  });
}
function updateExit(b, now){
  const ex = b.exit, G = M.geo, L = G.path.len;
  if (ex.phase === 'suck'){
    const t = clamp((now - ex.t0) / ex.suckDur, 0, 1), k = easeInOutCubic(t), p0 = G.path.pts[0];
    b.x = lerp(ex.fx, p0.x, k); b.y = lerp(ex.fy, p0.y, k);
    b.drawR = lerp(ex.r0, G.tubeR, k);
    b.ang += 0.25;
    if (t >= 1){ ex.phase = 'tube'; ex.t0 = now; ex.a0 = b.ang; }
    return;
  }
  const el = now - ex.t0;
  let s, off = 0, done = false;
  if (ex.single){
    const tA = 900, tP = 1700, tB = 650, sp = G.path.sPause;
    if (el < tA) s = sp * easeInOutSine(el / tA);
    else if (el < tA + tP){
      s = sp; off = Math.sin(el * 0.045) * 1.6;
      if (!ex.rolled){ ex.rolled = true; Sound.roll(tP / 1000); showMsg('두구두구… 과연 누구일까요?'); }
    } else if (el < tA + tP + tB){ const u = (el - tA - tP) / tB; s = sp + (L - sp) * u * u; }
    else { s = L; done = true; }
  } else {
    const u = clamp(el / ex.tubeDur, 0, 1);
    s = L * (0.55 * u * u + 0.45 * u);
    if (u >= 1){ s = L; done = true; }
  }
  const p = pointAt(s);
  b.x = p.x + off; b.y = p.y; b.drawR = G.tubeR;
  b.ang = ex.a0 + s / G.tubeR;
  if (done){
    M.exiting.splice(M.exiting.indexOf(b), 1);
    b.inDome = false;
    const r = ex.resolve; b.exit = null; r();
  }
}

/* ---- 메인 루프 ---- */
function step(dt, now){
  M.wind += (M.windTarget - M.wind) * Math.min(1, dt * 4);
  const act = M.balls.filter(b => b.inDome && !b.exit);
  const steps = act.length > 60 ? 2 : 3, h = dt / steps;
  for (let s = 0; s < steps; s++) physics(act, h);
  if (M.wind < 0.05 && !M.drawing && act.length && Math.random() < 0.06){ // 대기 중 살짝 흔들림
    const b = act[(Math.random() * act.length) | 0];
    b.vx += (Math.random() - 0.5) * M.geo.R * 0.5; b.vy -= Math.random() * M.geo.R * 0.35;
  }
  for (const b of act){
    b.ang += (b.vx / b.r) * dt * 0.8;
    if (M.wind < 0.05 && Math.abs(b.vx) + Math.abs(b.vy) < 25){ b.ang = wrapAngle(b.ang) * 0.9; }
  }
  for (const b of M.exiting.slice()) updateExit(b, now);
}
function render(){
  const G = M.geo; if (!G || !M.layers) return;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(M.layers.bk, 0, 0);
  ctx.setTransform(G.dpr, 0, 0, G.dpr, 0, 0);
  for (const b of M.balls) if (b.inDome && !b.exit) drawBallAt(b, b.x, b.y, b.r, b.ang);
  for (const b of M.exiting) drawBallAt(b, b.x, b.y, b.drawR, b.ang);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(M.layers.fr, 0, 0);
}
function loop(now){
  if (!M.running) return;
  const dt = Math.min((now - M.lastT) / 1000, 1 / 30);
  M.lastT = now;
  if (M.geo){ step(dt, now); render(); }
  requestAnimationFrame(loop);
}
function startLoop(){ if (M.running) return; M.running = true; M.lastT = performance.now(); requestAnimationFrame(loop); }
function stopLoop(){ M.running = false; }

/* ---- UI ---- */
function setMarquee(title){
  const track = $('#marqueeTrack');
  const unit = `★ ${title} ★ 행운을 빕니다   `;
  track.innerHTML = '';
  for (let i = 0; i < 2; i++){ const s = document.createElement('span'); s.textContent = unit.repeat(4); track.appendChild(s); }
  requestAnimationFrame(() => {
    const w = track.firstChild ? track.firstChild.offsetWidth : 1000;
    track.style.setProperty('--dur', Math.max(8, w / 75) + 's');
  });
}
function showMsg(t, err){ msgEl.textContent = t || ''; msgEl.classList.toggle('err', !!err); }
function invalidInput(t){
  showMsg(t, true);
  displayWrap.classList.remove('shake'); void displayWrap.offsetWidth;
  displayWrap.classList.add('shake', 'err');
  countIn.focus(); countIn.select();
}
displayWrap.addEventListener('animationend', () => displayWrap.classList.remove('shake'));

function setControls(on){
  const can = on && M.remaining > 0;
  countIn.disabled = !can; minusBtn.disabled = !can; plusBtn.disabled = !can; startBtn.disabled = !can;
  backTop.disabled = M.drawing;
}
function updateRemain(){
  M.remaining = M.balls.filter(b => b.inDome).length;
  remainText.textContent = `남은 공 ${M.remaining}개 / 전체 ${M.balls.length}개`;
  const v = parseInt(countIn.value, 10);
  if (M.remaining > 0 && (!(v >= 1) || v > M.remaining)) countIn.value = String(Math.min(Math.max(v || 1, 1), M.remaining));
  trayCount.textContent = M.results.length ? `${M.results.length}명` : '';
}
function updateActions(){
  const has = M.results.length > 0, busy = M.drawing;
  saveBtn.disabled = shareBtn.disabled = copyBtn.disabled = !has || busy;
  contBtn.disabled = busy || !has || M.remaining === 0;
  contBtn.textContent = M.remaining ? `이어서 추첨 (남은 ${M.remaining}개)` : '남은 공 없음';
  resetBtn.disabled = busy || !has;
  editBtn.disabled = busy;
}
function resetTray(){
  tray.innerHTML = '<div class="tray-empty">아직 뽑힌 공이 없어요</div>';
  trayCount.textContent = '';
}
function addTrayBall(res){
  const empty = tray.querySelector('.tray-empty'); if (empty) empty.remove();
  const C = COLORS[res.ci];
  const el = document.createElement('div');
  el.className = 'tb arrive glow';
  el.style.setProperty('--c', C.base); el.style.setProperty('--d', C.dark);
  const bd = document.createElement('span'); bd.className = 'badge'; bd.textContent = badge(res.n);
  const ball = document.createElement('div'); ball.className = 'tball';
  const nm = document.createElement('span');
  const chars = Array.from(res.name);
  nm.textContent = chars.length > 7 ? chars.slice(0, 6).join('') + '…' : res.name;
  nm.style.fontSize = Math.max(9, Math.min(16, 44 / Math.max(2, Math.min(chars.length, 7)))) + 'px';
  ball.title = res.name;
  ball.appendChild(nm);
  el.append(bd, ball);
  el.setAttribute('aria-label', `${badge(res.n)} ${res.name}`);
  tray.appendChild(el);
  setTimeout(() => el.classList.remove('glow'), 1600);
}

function scatterBall(b, upperOnly){
  const { cx, cy, R, r } = M.geo;
  const ang = Math.random() * Math.PI * 2, rad = Math.sqrt(Math.random()) * (R - r - 4);
  b.x = cx + Math.cos(ang) * rad;
  b.y = upperOnly ? cy - Math.abs(Math.sin(ang)) * rad * 0.9 : cy + Math.sin(ang) * rad * 0.9 - R * 0.1;
  b.vx = (Math.random() - 0.5) * 60; b.vy = 0; b.ang = (Math.random() - 0.5) * 2;
}

function initMachine(names, title){
  M.names = names; M.title = title; M.duty = title.includes('당직');
  M.results = []; M.exiting = []; M.imageCache = null; M.drawing = false; M.wind = 0; M.windTarget = 0; M.lastDrawAt = null;
  $('#srTitle').textContent = `${title} 로또기계`;
  setMarquee(title);
  resetTray();
  M.balls = names.map((n, i) => ({ id:i, name:n, ci:i % 5, x:0, y:0, vx:0, vy:0, r:10, ang:0, drawR:10, inDome:true, exit:null, sprite:null }));
  M.geo = null; M.gloss = null;
  layout();
  M.balls.forEach(b => scatterBall(b, false));
  countIn.value = '1';
  updateRemain(); setControls(true); updateActions();
  showMsg(`1 ~ ${M.remaining} 사이 숫자를 입력하고 [추첨 시작]을 누르세요`);
  startLoop();
  ensureFonts(names.join('') + title).then(rebuildSprites);
  announce(`${title}. 참여자 ${names.length}명의 공이 준비되었습니다.`);
}

async function startDraw(){
  if (M.drawing) return;
  Sound.ensure();
  const rem = M.balls.filter(b => b.inDome);
  if (!rem.length){ showMsg('남은 공이 없어요. [다시 추첨]으로 처음부터 시작하세요', true); return; }
  const raw = countIn.value.trim();
  const k = /^\d+$/.test(raw) ? parseInt(raw, 10) : NaN;
  if (!(k >= 1 && k <= rem.length)){ invalidInput(`1 ~ ${rem.length} 사이의 숫자를 입력해 주세요 (남은 공 ${rem.length}개)`); return; }
  displayWrap.classList.remove('err');

  // 뽑힐 순서를 애니메이션 전에 확정 (물리 결과와 무관)
  const picks = shuffle(rem).slice(0, k);

  closeWinner();
  M.drawing = true; M.imageCache = null; M.lastDrawAt = new Date();
  setControls(false); updateActions();
  const single = k === 1;
  M.windTarget = 1; Sound.mixStart();
  showMsg(single ? '공을 섞는 중… 과연 누가 뽑힐까요?' : `공을 섞는 중… ${k}명을 뽑습니다`);
  announce(`추첨을 시작합니다. ${k}명을 뽑습니다.`);
  await sleep(single ? 4000 : 2500);

  let last = null;
  for (let i = 0; i < picks.length; i++){
    const b = picks[i], n = M.results.length + 1;
    M.windTarget = 0.6; Sound.mixLevel(0.55);
    showMsg(single ? '출구로 빨려 올라갑니다!' : `${badge(n)} 공이 나옵니다… (${i + 1}/${k})`);
    await exitBall(b, single);
    last = { n, name:b.name, ci:b.ci };
    M.results.push(last);
    addTrayBall(last);
    Sound.drop();
    announce(`${badge(n)} ${b.name}`);
    updateRemain();
    if (i < picks.length - 1) await sleep(150);
  }

  M.windTarget = 0; Sound.mixStop();
  M.drawing = false;
  updateRemain(); setControls(true); updateActions();
  showMsg(M.remaining > 0 ? `추첨 완료! 남은 공 ${M.remaining}개` : '추첨 완료! 모든 공을 뽑았어요');
  M.imageCache = buildImageBlob().catch(() => null);
  if (single){
    Sound.fanfare(); showWinner(last); confetti();
    setTimeout(() => announce(`당첨: ${last.name}. 추첨 완료. ${resultText()}`), 400);
  } else {
    announce(`추첨 완료. ${resultText()}`);
    trayWrap.scrollIntoView({ behavior:'smooth', block:'nearest' });
  }
}

/* ---- 당첨 오버레이 & 색종이 ---- */
const winnerEl = $('#winner');
function showWinner(res){
  const C = COLORS[res.ci], wb = $('#wBall');
  wb.style.setProperty('--c', C.base); wb.style.setProperty('--d', C.dark);
  wb.style.animation = 'none'; void wb.offsetWidth; wb.style.animation = '';
  $('#wTitle').textContent = M.title;
  $('#wLabel').textContent = M.results.length === 1 ? '★ 당첨 ★' : `★ ${badge(res.n)} ★`;
  const nm = $('#wName'), len = Array.from(res.name).length;
  nm.textContent = res.name;
  nm.style.fontSize = `min(${Math.max(16, Math.min(56, 170 / Math.max(2, len)))}px, ${Math.max(5, Math.min(13, 40 / Math.max(2, len)))}vw)`;
  winnerEl.classList.remove('hidden');
  $('#wClose').focus();
}
function closeWinner(){
  if (winnerEl.classList.contains('hidden')) return;
  winnerEl.classList.add('hidden');
  if (screen2.classList.contains('active')) (saveBtn.disabled ? startBtn : saveBtn).focus();
}
$('#wClose').addEventListener('click', closeWinner);
winnerEl.addEventListener('click', e => { if (e.target === winnerEl) closeWinner(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeWinner(); });

function confetti(){
  const cv = $('#confetti'), g = cv.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2), W = innerWidth, H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; cv.style.display = 'block';
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cols = ['#ffd400', '#ff4d6d', '#4dabf7', '#51cf66', '#ffffff', '#ff922b', '#cc5de8'];
  const sc = Math.max(0.7, H / 800), ps = [];
  const mk = (x, y, vx, vy) => ({ x, y, vx, vy, w:6 + Math.random() * 7, h:9 + Math.random() * 9, rot:Math.random() * 6, vr:(Math.random() - 0.5) * 12, flip:Math.random() * 6, vf:5 + Math.random() * 8, c:cols[(Math.random() * cols.length) | 0] });
  for (let i = 0; i < 180; i++){
    const left = i % 2 === 0;
    ps.push(mk(left ? -10 : W + 10, H * 0.78, (left ? 1 : -1) * (250 + Math.random() * 650) * sc, -(650 + Math.random() * 650) * sc));
  }
  for (let i = 0; i < 80; i++) ps.push(mk(Math.random() * W, -20 - Math.random() * H * 0.5, (Math.random() - 0.5) * 120, 100 + Math.random() * 200));
  let last = performance.now(); const start = last;
  (function frame(now){
    const dt = Math.min((now - last) / 1000, 0.033); last = now;
    g.clearRect(0, 0, W, H);
    let alive = 0;
    for (const p of ps){
      p.vy += 560 * dt; if (p.vy > 300) p.vy = 300;
      p.vx *= (1 - 1.4 * dt);
      p.x += p.vx * dt + Math.sin(p.flip) * 0.6; p.y += p.vy * dt;
      p.rot += p.vr * dt; p.flip += p.vf * dt;
      if (p.y < H + 30) alive++;
      g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.scale(1, Math.cos(p.flip));
      g.fillStyle = p.c; g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      g.restore();
    }
    if (alive && now - start < 7000) requestAnimationFrame(frame);
    else { g.clearRect(0, 0, W, H); cv.style.display = 'none'; }
  })(start);
}

/* ---- 결과 이미지 (별도 캔버스에 직접 그림) ---- */
function kst(d){
  const k = new Date(d.getTime() + 9 * 3600 * 1000);
  const p = n => String(n).padStart(2, '0');
  return { Y:k.getUTCFullYear(), M:p(k.getUTCMonth() + 1), D:p(k.getUTCDate()), h:p(k.getUTCHours()), m:p(k.getUTCMinutes()), w:'일월화수목금토'[k.getUTCDay()] };
}
function fmtDate(d){ const t = kst(d); return `${t.Y}.${t.M}.${t.D} (${t.w}) ${t.h}:${t.m}`; }
function fileName(){
  const t = kst(M.lastDrawAt || new Date());
  const safe = M.title.replace(/[\\/:*?"<>|\s]+/g, '_').replace(/^_+|_+$/g, '') || '추첨';
  return `추첨결과_${safe}_${t.Y}${t.M}${t.D}_${t.h}${t.m}.png`;
}
function wrapTokens(g, tokens, sep, maxW){
  const lines = []; let line = '';
  for (const t of tokens){
    const test = line ? line + sep + t : t;
    if (line && g.measureText(test).width > maxW){ lines.push(line); line = t; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}
async function buildImageBlob(){
  const W = 1080, H = 1350;
  const res = M.results.slice(), names = M.names.slice(), title = M.title, at = M.lastDrawAt || new Date();
  await ensureFonts(title + names.join('') + '0123456789순위번당첨전체참여자명단무작위비복원추첨일시월화수목금토().:·★…LUCKYDRAW');
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');

  // 배경
  let gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#1b2353'); gr.addColorStop(1, '#0a0e24');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  gr = g.createRadialGradient(W / 2, 0, 0, W / 2, 0, H * 0.7); gr.addColorStop(0, 'rgba(255,215,90,0.16)'); gr.addColorStop(1, 'rgba(255,215,90,0)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  g.globalAlpha = 0.35;
  [[80, 70, 40, 0], [150, 40, 18, 1], [W - 85, 90, 34, 2], [W - 160, 44, 18, 4], [W - 50, 180, 14, 3]].forEach(([x, y, r, ci]) => { drawBallBase(g, x, y, r, ci, ''); drawBallGloss(g, x, y, r); });
  g.globalAlpha = 1;

  // 헤더
  g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  g.fillStyle = '#ffd45a'; g.font = `800 26px ${FONT}`;
  g.fillText('L U C K Y   D R A W', W / 2, 92);
  const tf = fitText(g, title, 940, 76, 36, 900);
  g.font = tf.font; g.fillStyle = '#ffffff'; g.fillText(tf.text, W / 2, 178);
  g.fillStyle = '#ffd45a'; roundRectPath(g, W / 2 - 60, 204, 120, 6, 3); g.fill();
  g.font = `600 32px ${FONT}`; g.fillStyle = '#b8c2ea';
  g.fillText(`추첨 일시  ${fmtDate(at)}`, W / 2, 262);

  // 하단: 참여자 명단 (높이 먼저 계산)
  const listMaxH = 230;
  let fs = 24, lines, lh;
  for (;;){
    g.font = `500 ${fs}px ${FONT}`;
    lines = wrapTokens(g, names, '  ·  ', 940);
    lh = Math.round(fs * 1.45);
    if (lines.length * lh <= listMaxH || fs <= 12) break;
    fs--;
  }
  if (lines.length * lh > listMaxH){ const ml = Math.floor(listMaxH / lh); lines = lines.slice(0, ml); lines[ml - 1] += ' …'; }
  const listTop = H - 56 - lines.length * lh;
  const labelY = listTop - 14, sepY = labelY - 46, summaryY = sepY - 28;
  g.textAlign = 'center';
  g.font = `700 28px ${FONT}`; g.fillStyle = '#d7def7';
  g.fillText(`전체 참여자 ${names.length}명 · 무작위 비복원 추첨`, W / 2, summaryY);
  g.strokeStyle = 'rgba(255,255,255,0.15)'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(70, sepY); g.lineTo(W - 70, sepY); g.stroke();
  g.font = `800 21px ${FONT}`; g.fillStyle = '#8f9bc8'; g.fillText('참여자 명단', W / 2, labelY);
  g.font = `500 ${fs}px ${FONT}`; g.fillStyle = '#aeb8de';
  lines.forEach((ln, i) => g.fillText(ln, W / 2, listTop + fs + i * lh));

  // 결과 영역
  const areaTop = 300, areaBottom = summaryY - 64, areaH = areaBottom - areaTop;
  if (res.length === 1){
    const r0 = res[0], cyb = areaTop + areaH * 0.57, br = Math.min(230, areaH * 0.36);
    g.textAlign = 'center'; g.textBaseline = 'alphabetic';
    g.font = `900 66px ${FONT}`; g.fillStyle = '#ffd45a';
    g.save(); g.shadowColor = 'rgba(255,212,90,0.6)'; g.shadowBlur = 30;
    g.fillText('★ 당첨 ★', W / 2, cyb - br - 36);
    g.restore();
    g.save(); g.fillStyle = 'rgba(0,0,0,0.35)'; g.filter = 'blur(14px)';
    g.beginPath(); g.ellipse(W / 2, cyb + br + 18, br * 0.8, 20, 0, 0, Math.PI * 2); g.fill(); g.restore();
    g.save(); g.shadowColor = 'rgba(255,212,90,0.55)'; g.shadowBlur = 80; g.fillStyle = COLORS[r0.ci].base;
    g.beginPath(); g.arc(W / 2, cyb, br, 0, Math.PI * 2); g.fill(); g.restore();
    drawBallBase(g, W / 2, cyb, br, r0.ci, r0.name); drawBallGloss(g, W / 2, cyb, br);
  } else {
    const n = res.length;
    const cols = n <= 10 ? 1 : n <= 24 ? 2 : n <= 54 ? 3 : 4;
    const rows = Math.ceil(n / cols);
    const rowH = Math.min(cols === 1 ? 104 : 86, areaH / rows);
    const y0 = areaTop + (areaH - rowH * rows) / 2;
    const padX = 60, colW = (W - padX * 2) / cols;
    const bFont = Math.max(9, rowH * 0.3), nFont = Math.max(10, rowH * 0.42), br = rowH * 0.34, ph = Math.max(12, rowH * 0.5);
    g.font = `800 ${bFont}px ${FONT}`;
    const bw = Math.max(...res.map(r => g.measureText(badge(r.n)).width)) + bFont * 1.3;
    res.forEach((r, i) => {
      const col = Math.floor(i / rows), row = i % rows;
      const x = padX + col * colW, y = y0 + row * rowH, yc = y + rowH / 2;
      if (row % 2 === 0){ g.fillStyle = 'rgba(255,255,255,0.045)'; roundRectPath(g, x + 4, y + 2, colW - 8, rowH - 4, Math.min(16, rowH * 0.3)); g.fill(); }
      const sx = x + (cols === 1 ? 110 : Math.max(8, colW * 0.04));
      g.fillStyle = '#ffd45a'; roundRectPath(g, sx, yc - ph / 2, bw, ph, ph / 2); g.fill();
      g.fillStyle = '#2a1c00'; g.font = `800 ${bFont}px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(badge(r.n), sx + bw / 2, yc + 1);
      const bx = sx + bw + br + rowH * 0.18;
      drawBallBase(g, bx, yc, br, r.ci, String(r.n)); drawBallGloss(g, bx, yc, br);
      const nx = bx + br + rowH * 0.22, maxW = x + colW - nx - 12;
      const f = fitText(g, r.name, maxW, nFont, Math.max(8, nFont * 0.6), 800);
      g.font = f.font; g.textAlign = 'left'; g.textBaseline = 'middle'; g.fillStyle = '#ffffff';
      g.fillText(f.text, nx, yc + 1);
    });
  }
  const blob = await new Promise((ok, no) => c.toBlob(b => b ? ok(b) : no(new Error('toBlob failed')), 'image/png'));
  return { blob, name:fileName() };
}
async function getImage(){
  let r = M.imageCache ? await M.imageCache : null;
  if (!r){ M.imageCache = buildImageBlob(); r = await M.imageCache; }
  return r;
}
function downloadBlob(blob, name){
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
const canShareFiles = (() => {
  try {
    if (!navigator.share || !navigator.canShare) return false;
    const f = new File([new Blob(['x'], { type:'image/png' })], 't.png', { type:'image/png' });
    return navigator.canShare({ files:[f] }) && window.matchMedia('(pointer: coarse)').matches;
  } catch(e){ return false; }
})();
if (canShareFiles){ shareBtn.classList.remove('hidden'); copyBtn.classList.add('wide'); }

saveBtn.addEventListener('click', async () => {
  saveBtn.disabled = true;
  try { const r = await getImage(); downloadBlob(r.blob, r.name); toast('이미지를 저장했어요'); }
  catch(e){ toast('이미지 생성에 실패했어요'); }
  finally { updateActions(); }
});
shareBtn.addEventListener('click', async () => {
  let r;
  try { r = await getImage(); } catch(e){ toast('이미지 생성에 실패했어요'); return; }
  const file = new File([r.blob], r.name, { type:'image/png' });
  try {
    if (navigator.canShare && navigator.canShare({ files:[file] })){ await navigator.share({ files:[file], title:M.title }); return; }
  } catch(e){ if (e && e.name === 'AbortError') return; }
  downloadBlob(r.blob, r.name); toast('공유를 지원하지 않아 이미지로 저장했어요');
});
copyBtn.addEventListener('click', async () => {
  const text = resultText();
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch(e){}
  if (!ok){
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch(e){}
    ta.remove();
  }
  toast(ok ? '결과를 복사했어요' : '복사에 실패했어요');
});
contBtn.addEventListener('click', () => {
  closeWinner();
  countIn.value = '1';
  showMsg(`남은 ${M.remaining}개 중 몇 명을 더 뽑을까요?`);
  stage.scrollIntoView({ behavior:'smooth', block:'center' });
  setTimeout(() => { countIn.focus(); countIn.select(); }, 350);
});
resetBtn.addEventListener('click', () => {
  if (M.drawing) return;
  closeWinner();
  M.results = []; M.imageCache = null; M.lastDrawAt = null;
  resetTray();
  M.balls.forEach(b => { if (!b.inDome){ b.inDome = true; b.r = M.geo.r; scatterBall(b, true); } });
  countIn.value = '1';
  updateRemain(); setControls(true); updateActions();
  showMsg('모든 공을 돔으로 되돌렸어요. 처음부터 다시 뽑아요');
  announce('모든 공을 돔으로 되돌렸습니다.');
  stage.scrollIntoView({ behavior:'smooth', block:'start' });
});
function backToInput(){
  if (M.drawing) return;
  closeWinner(); stopLoop(); Sound.mixStop();
  switchScreen(screen2, screen1, () => namesEl.focus());
}
editBtn.addEventListener('click', backToInput);
backTop.addEventListener('click', backToInput);

startBtn.addEventListener('click', startDraw);
countIn.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); startDraw(); } });
countIn.addEventListener('input', () => {
  const v = countIn.value.replace(/\D/g, '').slice(0, 3);
  if (v !== countIn.value) countIn.value = v;
  if (msgEl.classList.contains('err')){ showMsg(''); displayWrap.classList.remove('err'); }
});
function bump(d){
  const v = parseInt(countIn.value, 10) || 0;
  countIn.value = String(clamp(v + d, 1, Math.max(1, M.remaining)));
  if (msgEl.classList.contains('err')){ showMsg(''); displayWrap.classList.remove('err'); }
}
minusBtn.addEventListener('click', () => bump(-1));
plusBtn.addEventListener('click', () => bump(1));

function renderMute(){
  muteBtn.textContent = Sound.muted ? '🔇 소리 꺼짐' : '🔊 소리 켜짐';
  muteBtn.setAttribute('aria-pressed', String(Sound.muted));
}
muteBtn.addEventListener('click', () => {
  Sound.ensure(); Sound.setMuted(!Sound.muted); store.set(MUTE_KEY, Sound.muted); renderMute();
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (Sound.ctx && !M.drawing) Sound.ctx.suspend().catch(() => {}); }
  else if (Sound.ctx) Sound.ctx.resume().catch(() => {});
  M.lastT = performance.now();
});

/* ---- 시작 ---- */
setTitleMode('duty');
renderMute();
setupLoadLast();
renderPreview();
})();
